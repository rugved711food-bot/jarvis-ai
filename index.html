!DOCTYPE html>

<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JARVIS AI</title>

  <style>

    body {

      background: #07111f;

      color: white;

      font-family: Arial;

      text-align: center;

      padding: 25px;

    }

    h1 { color: #00d9ff; }

    .circle {

      width: 150px;

      height: 150px;

      border: 4px solid #00d9ff;

      border-radius: 50%;

      margin: 30px auto;

      box-shadow: 0 0 25px #00d9ff;

    }

    input {

      padding: 13px;

      width: 70%;

      border-radius: 8px;

      border: none;

    }

    button {

      padding: 13px;

      background: #00d9ff;

      border: none;

      border-radius: 8px;

      margin: 5px;

    }

    #reply { margin-top: 25px; }

  </style>

</head>

<body>

  <h1>J.A.R.V.I.S</h1>

  <p>Your Personal AI Assistant</p>

  <div class="circle"></div>

  <input id="question" placeholder="Ask JARVIS something...">
